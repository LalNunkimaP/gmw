<main class="login-page">
  <section class="login-visual" aria-label="Goa Mizo Welfare community">
    <img src="/assets/images/community-gathering.jpg" alt="A table prepared for a community gathering" />
    <div class="visual-copy">
      <p class="visual-eyebrow">GOA MIZO WELFARE</p>
      <h1>Khawtlang pakhat, hun thar tam tak.</h1>
      <p>Kan inlaichinna leh kan khawtlang tan kan thawhhohna.</p>
    </div>
  </section>

  <section class="login-panel">
    <div class="login-form-wrap">
      <p class="form-eyebrow">GOA MIZO WELFARE</p>
      <h2>Sign in</h2>
      <p class="form-intro">Member leh administrator-te tan.</p>

      <form (ngSubmit)="signIn()">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          placeholder="name@example.com"
          [(ngModel)]="email"
          required
        />

        <label for="password">Password</label>
        <div class="password-field">
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="Enter your password"
            [(ngModel)]="password"
            required
          />
          <button
            class="password-toggle"
            type="button"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            (click)="showPassword = !showPassword"
          >
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>

        @if (errorMessage) {
          <p class="login-error" role="alert">{{ errorMessage }}</p>
        }

        <button class="submit-button" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
    </div>
  </section>
</main>
